<p> [ archive status: open ]  [ last updated: occasionally ]</p>
<p class="site-footer-info">
  <span>© 2022 – {{ now.Format "2006" }}</span>
  <span id="site-running-time">已运行 0 天</span>
  {{ if not (.Param "hideMadeWithLine") }}
<a href="https://github.com/janraasch/hugo-bearblog/"> · Hugo ʕ•ᴥ•ʔ Bear </a>

<div class="bird-station">
  <div class="bird-station-header" onclick="fetchRandomBird()">
    <span class="indicator-dot"></span>
    <span class="header-title">✦ 翻开草丛：随机观测野生鸟类</span>
    <span class="refresh-icon">↺</span>
  </p>
</div>
  <div id="bird-card" class="bird-card-body">
    <div class="bird-img-container">
      <img id="bird-img" src="" alt="Bird"/>
    </div>
    <div class="bird-details">
      <span class="bird-tag">SOME-RANDOM-API OBSERVED</span>
      <p id="bird-fact" class="bird-fact">点击上方按键，开始寻找小鸟...</p>
    </div>
  </div>

<script>
  (function() {
    // 1. 设置你的建站日期（格式：YYYY-MM-DD）
    const startDate = new Date('2022-01-03'); 
    const now = new Date();
    
    // 2. 计算相差天数
    const diffTime = Math.abs(now - startDate);
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    
    // 3. 渲染到页面
    const elem = document.getElementById('site-running-time');
    if (elem) {
      elem.innerText = ` | 已运行 ${diffDays} 天`;
    }
  })();
</script>
<script>
async function fetchRandomBird() {
  const card = document.getElementById('bird-card');
  const img = document.getElementById('bird-img');
  const fact = document.getElementById('bird-fact');
  
  card.classList.add('is-open');
  card.style.opacity = '0.5';
  
  // 1. 开始查询时，立刻隐藏之前的图片，避免显示裂图占位符
  img.style.display = 'none';
  img.src = ''; 
  fact.innerText = '正在调用望远镜...';

  try {
    const response = await fetch('/api/bird?t=' + Date.now());
    if (!response.ok) throw new Error("Network response was not ok");

    const data = await response.json();

    if (data && data.image && data.fact) {
      const tempImg = new Image();
      tempImg.src = data.image;

      // 2. 图片在后台加载完成后，再给页面上的 img 赋值并显示
      tempImg.onload = () => {
        img.src = data.image;
        img.style.display = 'block'; // 彻底加载好后再显现
        fact.innerHTML = `<strong>BIRD FACT: </strong><br>${data.fact}`;
        card.style.opacity = '1';
      };

      tempImg.onerror = () => {
        img.style.display = 'none'; // 图片加载失败时保持隐藏
        fact.innerHTML = `<strong>BIRD FACT: </strong><br>${data.fact}<br><br><small style="color:#888;">(照片未能加载，再试一次吧)</small>`;
        card.style.opacity = '1';
      };
    } else {
      throw new Error("Invalid payload format");
    }

  } catch (error) {
    console.error("Bird API Error:", error);
    img.style.display = 'none';
    fact.innerText = '小鸟扑腾着飞走了，再试一次吧。';
    card.style.opacity = '1';
  }
}
</script>
{{ end }}
